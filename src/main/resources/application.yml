spring:
  application:
    name: competition_cert_system
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/competition_cert_db?serverTimezone=Asia/Shanghai&charSet=utf8
    username: postgres
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 3

mybatis-plus:
  type-aliases-package: cn.guet.competition_cert_system.entity
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8888

jwt:
  secret: your-secret-key-at-least-256-bits-long-for-hs256-algorithm  # JWT 签名密钥（生产环境请换复杂字符串，至少32个字符）
  access-expiration: 86400000  # Access Token 过期时间（毫秒）, 默认 24 小时 = 86400000ms
  refresh-expiration: 1296000000 # Refresh Token 过期时间, 默认 15 天

file:
  upload-path: C:/MINE_FILE_QZK/Code_Project_JAVA/certificates # 证书相关图片存放位置

password:
  salt: competition_cert_salt_2024 # 密码盐值（生产环境请更换复杂字符串）
